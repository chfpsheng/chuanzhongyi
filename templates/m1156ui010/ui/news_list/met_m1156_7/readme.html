</section>
  <section class="panel-body">
    <ul class="list-group list-group-bordered">
    <li class="list-group-item active">UI特点：</li>

    <li class="list-group-item ">2.直接在页面设置信息</li> 
    <li class="list-group-item ">3.多栏目的展示内容列表</li> 
    </ul>
</section>
  <section class="panel-body">
    <ul class="list-group list-group-bordered">

    </ul>
</section>
  <section class="panel-body">
    <ul class="list-group list-group-bordered">
